<!DOCTYPE html>
<html>
<head>
<title>Admin Test</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:8px}
input,button{padding:10px;margin:5px;border:none;border-radius:5px;width:90%}
button{background:#8b5cf6;color:white;width:auto;padding:10px 20px;cursor:pointer}
.hide{display:none}
.admin{border:2px solid #22c55e}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>লগইন</h2>
<input id="user" placeholder="ইউজারনেম লিখো">
<input id="pass" type="password" placeholder="পাসওয়ার্ড">
<button onclick="doLogin()">লগইন</button>
</div>

<div id="dashBox" class="card hide">
<h2>স্বাগতম <span id="name"></span> 👋</h2>
<button onclick="doLogout()">লগআউট</button>
</div>
